name: release

# Version management and packaging for everything that lands on the main branch.
#
# release-please keeps a single "release PR" open: it accumulates the conventional
# commits merged since the last tag and proposes the next version plus a CHANGELOG
# entry. Merging that PR is what creates the tag and the GitHub Release. The
# `publish` job then builds that exact tag and attaches the installable plugin
# tarball to the Release.
on:
    push:
        branches:
            - main

# Releases are strictly serial: two overlapping runs would race on the release PR.
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write
    issues: write

jobs:
    release-please:
        name: version and tag
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            released: ${{ steps.release.outputs.release_created }}
            tag: ${{ steps.release.outputs.tag_name }}
        steps:
            # `token` falls back to the workflow token, so the workflow works with
            # no setup at all. Set a RELEASE_PLEASE_TOKEN secret (a PAT) to make
            # GitHub run CI on the release PR too: pull requests opened with the
            # default GITHUB_TOKEN do not trigger other workflows.
            - name: Run release-please
              id: release
              uses: googleapis/release-please-action@v5
              with:
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    publish:
        name: build and attach the plugin package
        needs: release-please
        if: needs.release-please.outputs.released == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
        steps:
            # Build the tagged commit, not whatever main has moved on to, so the
            # attached package matches the release exactly.
            - name: Check out the released tag
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.release-please.outputs.tag }}

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Install Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # `lib/` is generated and git-ignored, so the bundle must be rebuilt
            # here; without this the tarball would carry no plugin at all.
            - name: Build
              run: pnpm run build

            # A DSH bundle installs from a tarball (or a directory, or a git
            # repository); the .tgz is the portable form of those.
            - name: Pack
              run: pnpm pack --pack-destination dist

            - name: Verify the package carries both halves
              run: ./scripts/verify-package.sh

            - name: Attach the package to the release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ needs.release-please.outputs.tag }}
              run: gh release upload "$TAG" dist/*.tgz --clobber

    npm-publish:
        name: publish to npm
        needs: release-please
        if: needs.release-please.outputs.released == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            # Publish the tagged commit, not main, so the registry version always
            # matches the tag and the attached tarball.
            - name: Check out the released tag
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.release-please.outputs.tag }}

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Install Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # `lib/` is generated and git-ignored, so the bundle must be rebuilt
            # before packing; `npm publish` would otherwise ship no plugin code.
            - name: Build
              run: pnpm run build

            # npm cannot mint a short-lived credential for a package that does not
            # exist yet, so the first release publishes with an automation token.
            # After the package exists, a trusted publisher can replace this secret
            # (repo, workflow `release.yml`, environment npm-publish) and the job
            # can drop NODE_AUTH_TOKEN in favour of `id-token: write`.
            - name: Publish to npm
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  if [ -z "${NODE_AUTH_TOKEN}" ]; then
                      echo "::error::NPM_TOKEN secret is not configured; add an npm automation token with publish rights for the scope"
                      exit 1
                  fi
                  npm publish --access public
