# Bundle patch layer: the row loads this package's main entry as the host half
# (a plain Cordis plugin); the `dsh.client` declaration in package.json makes
# the web app load ./lib/client.js as the browser half.
#
# The shipped permission plugin stays enabled: this bundle only adds a
# lower-priority registration to the composer's permission slot, so the
# `/permission` popup and the General-settings row keep their official
# behavior.
- insert:
      - id: full-access
        name: '@saoutax/dsh-full-access'
        config:
            defaultPreset: danger-full-access
